<ng-container *ngFor="let message of _messages; let i = index">
  <ion-row class="rawdata--container ion-padding-bottom">
    <ion-col class="ion-no-padding">
      <p>
        {{ 'message-signing-request.payload_label' | translate }}
        <span *ngIf="_messages.length > 1">({{ i + 1 }}/{{ _messages.length }})</span>
      </p>
      <pre class="ion-no-margin">{{ message.data | json }}</pre>
    </ion-col>
  </ion-row>
  <ion-row class="rawdata--container" *ngIf="message.blake2bHash">
    <ion-col class="ion-no-padding">
      <p>{{ 'message-signing-request.blake2b_hash' | translate }}</p>
      <pre class="ion-no-margin">{{ message.blake2bHash }}</pre>
    </ion-col>
  </ion-row>
  <ion-row class="ion-padding-top">
    <ion-col class="ion-no-padding">
      <ion-button expand="block" color="secondary" (click)="copyEncodedMessage(i)">
        <ion-icon name="clipboard-outline" slot="start"></ion-icon>
        {{ 'message-signing-request.copy_label' | translate }}
      </ion-button>
    </ion-col>
  </ion-row>
</ng-container>
